<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Who's Nearby</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="root"><main style="padding:24px;color:#fff;background:#111;min-height:100vh;font-family:system-ui,sans-serif">Loading app…</main></div>
    <script>
      window.setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.dataset.appMounted !== 'true') {
          root.innerHTML = '<main role="alert" style="padding:24px;color:#fff;background:#111;min-height:100vh;font-family:system-ui,sans-serif"><h1>App did not load</h1><p>Check your connection and reload this page.</p></main>';
        }
      }, 12000);
    </script>
  </body>
</html>
